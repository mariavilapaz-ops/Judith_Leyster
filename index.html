<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Judith Leyster · Publicaciones</title>

  <style>
/* ==========================================================
   Variables
   ========================================================== */
:root {
  --c-dark:  #373639;   /* fondo de Inicio_Web y Pantallas_Web */
  --c-lilac: #ddd5eb;   /* fondo de Home_Web */
  --c-stage: #2c2b2e;   /* fondo detrás del libro */
  --bar-h:   clamp(56px, 8.5vh, 96px);
  --flip-ms: 800ms;     /* mantener igual a CONFIG.flipMs en app.js */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--c-dark);
  font-family: system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ==========================================================
   Pantallas (screens)
   ========================================================== */
.screen {
  position: fixed;
  inset: 0;
  opacity: 0;
  visibility: hidden;          /* no display:none → getBBox() sigue funcionando */
  pointer-events: none;
  transition: opacity .45s ease, visibility 0s linear .45s;
}
.screen.is-active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .45s ease;
}

/* Intro: va encima y se desvanece más lento */
#screen-intro {
  z-index: 30;
  background: var(--c-dark);
  display: grid;
  place-items: center;
  transition: opacity 1.2s ease, visibility 0s linear 1.2s;
}
#screen-intro.is-active { transition: opacity 1.2s ease; }
#screen-intro > svg { display: block; width: 100%; height: 100%; user-select: none; }

/* Home */
#screen-home { background: var(--c-lilac); }
.svg-host { position: absolute; inset: 0; }
.svg-host > svg { display: block; width: 100%; height: 100%; }

/* ==========================================================
   Zonas interactivas dentro de los SVG
   ========================================================== */
.hotspot {
  cursor: pointer;
  outline: none;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform .25s ease, opacity .25s ease;
}
.hotspot .hit { fill: transparent; stroke: none; }   /* área de clic invisible */
.hotspot:hover,
.hotspot:focus-visible { transform: scale(1.06); }
.hotspot:active        { transform: scale(.97); }
.hotspot:focus-visible .hit {
  stroke: #6b5fa8;
  stroke-width: 3;
  stroke-dasharray: 8 6;
}
.hotspot.is-disabled { opacity: .3; cursor: default; pointer-events: none; }

/* ==========================================================
   Visor
   ========================================================== */
#screen-viewer {
  display: flex;
  flex-direction: column;
  background: var(--c-stage);
}

.viewer-bar {
  flex: 0 0 calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--c-dark);
  position: relative;
  z-index: 5;
  min-height: 0;
  overflow: hidden;
}
/* El SVG se coloca en absoluto para que no imponga su altura al flex */
.viewer-bar > svg { position: absolute; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); display: block; }

.stage {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  touch-action: pan-y pinch-zoom;   /* el swipe horizontal lo manejamos nosotros */
  user-select: none;
}

/* El slider desplaza el libro para que portada / contraportada queden centradas */
.slider {
  transition: transform var(--flip-ms) cubic-bezier(.45, .05, .25, 1);
}
.slider[data-pos="front"] { transform: translateX(-25%); }  /* 25% del ancho del libro = 1/2 página */
.slider[data-pos="back"]  { transform: translateX(25%); }
.slider[data-pos="open"]  { transform: translateX(0); }

.book {
  position: relative;
  perspective: 3200px;
}

/* Cada hoja gira sobre el lomo (centro del libro) */
.sheet {
  position: absolute;
  top: 0;
  left: 50%;
  width: 50%;
  height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform var(--flip-ms) cubic-bezier(.45, .05, .25, 1);
}
.sheet.is-flipped { transform: rotateY(-180deg); }

.face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #f4f2f7;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .32);
}
.face.back { transform: rotateY(180deg); }
.face canvas { display: block; width: 100%; height: 100%; }

/* Sombra suave junto al lomo */
.face::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.face.front::after { background: linear-gradient(90deg,  rgba(0,0,0,.22), transparent 7%); }
.face.back::after  { background: linear-gradient(270deg, rgba(0,0,0,.22), transparent 7%); }

/* Mensajes */
.status {
  position: absolute;
  inset: auto 0 50% 0;
  margin: 0;
  text-align: center;
  color: #ddd5eb;
  font-size: 15px;
  letter-spacing: .04em;
  padding: 0 24px;
  pointer-events: none;
}
.status:empty { display: none; }

.rotate-hint {
  display: none;
  position: absolute;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(221, 213, 235, .92);
  color: var(--c-dark);
  font-size: 13px;
  pointer-events: none;
  white-space: nowrap;
}
@media (max-width: 700px) and (orientation: portrait) {
  .rotate-hint { display: block; }
}

@media (prefers-reduced-motion: reduce) {
  .sheet, .slider { transition-duration: 1ms; }
  .screen { transition-duration: 1ms !important; }
}

.status .pick {
  display: block; margin: 12px auto 0; padding: 8px 16px; border: 0; border-radius: 999px;
  background: #ddd5eb; color: #373639; font: inherit; cursor: pointer; pointer-events: auto;
}

  </style>
</head>
<body>
  <main id="app">

    <!-- HOME (menú principal, debajo del splash) -->
    <section id="screen-home" class="screen is-active" aria-label="Menú principal">
      <div id="home-host" class="svg-host"></div>
    </section>

    <!-- VISOR: barra superior + flipbook -->
    <section id="screen-viewer" class="screen" aria-label="Visor de publicación">
      <header id="bar-host" class="viewer-bar"></header>
      <div id="stage" class="stage">
        <div id="slider" class="slider"><div id="book" class="book"></div></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="rotate-hint" class="rotate-hint">Gira el dispositivo para leer mejor</p>
      </div>
    </section>

    <!-- INTRO / SPLASH: encima de todo, 2,5 s y se desvanece -->
    <section id="screen-intro" class="screen is-active" aria-label="Presentación"></section>

  </main>

       Si el SVG no trae esos IDs, se usa el índice del <path> dentro de #elementos. */
    barButtons: {
      back: { ids: ['botonvolver', 'volver'],                           index: 0 },
      next: { ids: ['botonsiguiente', 'botonseguir', 'siguiente'],      index: 1 },
      home: { ids: ['botoncasa', 'casa', 'home'],                       index: 2 },
    },
  };

  const NS = 'http://www.w3.org/2000/svg';
  const $ = (sel) => document.querySelector(sel);

  /* ----------------------------------------------------------
     2 · UTILIDADES SVG
     ---------------------------------------------------------- */

  /* Al incrustar un SVG en el HTML, su <style> (.cls-1, .cls-2…) pasa a ser
     global y los tres archivos se pisarían entre sí (todos usan .cls-1).
     Se prefijan clases e ids para aislar cada SVG. */
  function scopeSvg(text, prefix) {
    return text
      .replace(/cls-(\d+)/g, `${prefix}-cls-$1`)
      .replace(/\bid="([^"]+)"/g, `id="${prefix}-$1"`)
      .replace(/url\(#([^)]+)\)/g, `url(#${prefix}-$1)`);
  }

  function mountSvg(host, id, prefix) {
    host.innerHTML = scopeSvg(document.getElementById('svg-' + id).textContent.trim(), prefix);
    const svg = host.querySelector('svg');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    return svg;
  }

  /* Normaliza un id: decodifica "_x00F3_" / "%C3%B3", quita tildes, minúsculas y símbolos */
  function normId(raw) {
    let t = raw.replace(/_x([0-9A-Fa-f]{4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
    try { t = decodeURIComponent(t); } catch (e) { /* no estaba codificado */ }
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }
  /* Busca un elemento por id (el id lleva el prefijo del SVG: "bar-Botón_Volver") */
  function findById(svg, prefix, names) {
    return [...svg.querySelectorAll('[id]')].find((el) =>
      el.id.startsWith(prefix + '-') && names.includes(normId(el.id.slice(prefix.length + 1))));
  }

  /* Devuelve los <path> de <g id="…-elementos"> en orden de documento */
  const getPaths = (svg) => [...svg.querySelectorAll('g[id$="-elementos"] > path')];

  /* Agrupa los <path> indicados en un <g> interactivo, con un <rect> invisible
     (un poco más grande que el dibujo) como área de clic.
     Devuelve { slot, el }: `slot` es un <g> externo para posicionar (transform),
     `el` es el botón (recibe hover/focus/clic). */
  function makeHotspot(pathEls, { label, pad = 24, onActivate }) {
    const slot = document.createElementNS(NS, 'g');
    const el = document.createElementNS(NS, 'g');
    pathEls[0].before(slot);
    slot.appendChild(el);
    pathEls.forEach((p) => el.appendChild(p));

    const b = el.getBBox();                       // caja del dibujo, en unidades del viewBox
    const hit = document.createElementNS(NS, 'rect');
    hit.setAttribute('class', 'hit');
    hit.setAttribute('x', b.x - pad);
    hit.setAttribute('y', b.y - pad);
    hit.setAttribute('width', b.width + pad * 2);
    hit.setAttribute('height', b.height + pad * 2);
    el.prepend(hit);

    el.setAttribute('class', 'hotspot');
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', label);
    el.addEventListener('click', onActivate);
    el.addEventListener('mouseup', () => el.blur());
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
    });
    return { slot, el };
  }

  /* ----------------------------------------------------------
     3 · pdf.js
     ---------------------------------------------------------- */
  function whenPdfjs() {
    return new Promise((resolve, reject) => {
      const t0 = Date.now();
      (function poll() {
        if (window.pdfjsLib) {
          if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = CONFIG.pdfWorker;
          resolve(window.pdfjsLib);
        } else if (Date.now() - t0 > 15000) {
          reject(new Error('pdf.js no se pudo cargar (¿sin conexión?)'));
        } else setTimeout(poll, 100);
      })();
    });
  }

  /* Lista de "hojas sueltas" (leaves) en orden de lectura.
     Cada leaf = una página visible del libro: { page, part }
       part: 'full' (página completa) | 'left' | 'right' (mitad de un pliego) */
  function buildLeaves(n, mode) {
    const L = [];
    if (mode === 'flat') {
      L.push({ page: 1, part: 'right' });                         // portada
      for (let p = 2; p <= n; p++) L.push({ page: p, part: 'left' }, { page: p, part: 'right' });
      L.push({ page: 1, part: 'left' });                          // contraportada
    } else {
      L.push({ page: 1, part: 'full' });                          // portada
      for (let p = 2; p <= n - 1; p++) L.push({ page: p, part: 'left' }, { page: p, part: 'right' });
      L.push({ page: n, part: 'full' });                          // contraportada
    }
    if (L.length % 2) L.splice(L.length - 1, 0, { page: 0, part: 'full' });   // hoja en blanco de seguridad
    return L;
  }

  /* Selector de archivo de respaldo: lee el PDF con FileReader.readAsArrayBuffer y
     entrega un Uint8Array (formato que pdf.js acepta siempre en la opción `data`). */
  function pickPdf(cb) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,.pdf';
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => cb(new Uint8Array(reader.result));
      reader.readAsArrayBuffer(file);
    };
    input.click();
  }

  /* Abre un PDF con pdf.js. `src` puede ser:
       · una ruta/URL ("Gaceta.pdf")      → 1º streaming de pdf.js con URL absoluta,
                                            2º respaldo: fetch() + datos en memoria
       · Uint8Array / ArrayBuffer         → datos ya leídos (selector de archivo)         */
  async function loadPdfDocument(pdfjs, src) {
    if (src instanceof ArrayBuffer) src = new Uint8Array(src);
    if (src instanceof Uint8Array) return pdfjs.getDocument({ data: src }).promise;

    let abs = String(src);
    try { abs = new URL(abs, document.baseURI || location.href).href; } catch (e) { /* se usa tal cual */ }
    try {
      return await pdfjs.getDocument({ url: abs }).promise;
    } catch (firstErr) {
      console.warn('pdf.js no pudo abrir la URL directamente; probando fetch()…', firstErr);
      const res = await fetch(abs);
      if (!res.ok) throw new Error(`HTTP ${res.status} al pedir ${src}`);
      const data = new Uint8Array(await res.arrayBuffer());
      return pdfjs.getDocument({ data }).promise;
    }
  }

  /* ----------------------------------------------------------
     4 · FLIPBOOK
     Estructura: cada "hoja" (sheet) tiene frente y dorso.
       sheet j → frente = leaf[2j], dorso = leaf[2j+1]
     Estado f = nº de hojas ya giradas (0 … S).
       f = 0  → libro cerrado por delante (portada centrada)
       f = S  → libro cerrado por detrás  (contraportada centrada)
       resto  → pliego: izquierda = dorso de hoja f-1, derecha = frente de hoja f
     ---------------------------------------------------------- */
  class Flipbook {
    constructor({ stage, slider, book, status, onChange }) {
      Object.assign(this, { stage, slider, book, statusEl: status, onChange });
      this.token = 0;
      this.reset();
      this.#bindInput();
      new ResizeObserver(() => this.fit()).observe(stage);
    }

    reset() {
      this.doc = null;
      this.leaves = [];
      this.sheets = [];
      this.byPage = new Map();       // nº página → leaves que dependen de ella
      this.done = new Map();         // nº página → resolución (px) con la que se pintó
      this.queue = Promise.resolve();
      this.wanted = new Set();
      this.f = 0;
      this.S = 0;
      this.busy = false;
      this.W = 1;
      this.H = 1;
      this.s = 1;
      this.book.replaceChildren();
    }

    get isOpen() { return !!this.doc; }
    setStatus(t = '') { this.statusEl.textContent = t; }
    get canPrev() { return this.isOpen && this.f > 0; }
    get canNext() { return this.isOpen && this.f < this.S; }

    async open(src, coverMode) {
      this.close();
      this.last = { src, coverMode };
      const token = ++this.token;
      this.setStatus('Cargando…');
      try {
        const pdfjs = await whenPdfjs();
        const doc = await loadPdfDocument(pdfjs, src);
        if (token !== this.token) { doc.destroy(); return; }

        const v1 = (await doc.getPage(1)).getViewport({ scale: 1 });
        this.doc = doc;
        // tamaño de UNA página: portada suelta ('single') o mitad de la cubierta abierta ('flat')
        this.W = coverMode === 'flat' ? v1.width / 2 : v1.width;
        this.H = v1.height;
        this.leaves = buildLeaves(doc.numPages, coverMode);
        this.#buildDom();
        this.fit();
        this.#apply();
        this.#restack();
        await this.#refresh();
        if (token === this.token) this.setStatus('');
        this.onChange?.();
      } catch (err) {
        console.error(err);
        if (token === this.token) {
          // Con file:// los navegadores bloquean la lectura del PDF: se ofrece elegirlo a mano
          this.setStatus(`No se pudo leer el PDF automáticamente (${err.message}). `);
          const btn = document.createElement('button');
          btn.className = 'pick';
          btn.textContent = 'Elegir el archivo PDF…';
          btn.onclick = () => pickPdf((buf) => this.open(buf, coverMode));
          this.statusEl.appendChild(btn);
        }
      }
    }

    close() {
      this.token++;
      this.doc?.destroy();
      this.reset();
      this.setStatus('');
      this.slider.dataset.pos = 'front';
    }

    /* ---- DOM ---- */
    #buildDom() {
      this.S = this.leaves.length / 2;
      const frag = document.createDocumentFragment();
      for (let j = 0; j < this.S; j++) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        for (const [side, leaf] of [['front', this.leaves[2 * j]], ['back', this.leaves[2 * j + 1]]]) {
          const face = document.createElement('div');
          face.className = `face ${side}`;
          if (leaf.page) {
            leaf.canvas = document.createElement('canvas');
            face.appendChild(leaf.canvas);
            if (!this.byPage.has(leaf.page)) this.byPage.set(leaf.page, []);
            this.byPage.get(leaf.page).push(leaf);
          }
          sheet.appendChild(face);
        }
        this.sheets.push(sheet);
        frag.appendChild(sheet);
      }
      this.book.appendChild(frag);
    }

    /* Ajusta el libro al máximo espacio disponible (como "Vista previa") */
    fit() {
      if (!this.isOpen) return;
      const r = this.stage.getBoundingClientRect();
      const pad = Math.min(14, r.width * 0.01);
      const s = Math.min((r.width - pad * 2) / (this.W * 2), (r.height - pad * 2) / this.H);
      this.s = Math.max(s, 0.01);
      const w = this.W * 2 * this.s, h = this.H * this.s;
      for (const el of [this.slider, this.book]) {
        el.style.width = `${w}px`;
        el.style.height = `${h}px`;
      }
      clearTimeout(this.resizeT);
      this.resizeT = setTimeout(() => this.#refresh(), 250);   // re-pinta si hace falta más resolución
    }

    /* ---- Estado y navegación ---- */
    #apply() {
      this.sheets.forEach((el, i) => el.classList.toggle('is-flipped', i < this.f));
      this.slider.dataset.pos = this.f === 0 ? 'front' : this.f === this.S ? 'back' : 'open';
    }
    #restack() {
      this.sheets.forEach((el, i) => { el.style.zIndex = i < this.f ? i : this.S - i; });
    }

    go(dir) {
      if (!this.isOpen || this.busy) return;
      const nf = this.f + dir;
      if (nf < 0 || nf > this.S) return;
      this.busy = true;
      this.sheets[dir > 0 ? this.f : nf].style.zIndex = 1000;   // la hoja que gira va por encima
      this.f = nf;
      this.#apply();
      this.#refresh();
      this.onChange?.();
      setTimeout(() => { this.#restack(); this.busy = false; }, CONFIG.flipMs + 30);
    }
    next() { this.go(+1); }
    prev() { this.go(-1); }

    /* ---- Render lazy: solo lo visible y sus vecinos ---- */
    get #targetRes() {   // píxeles de ancho de UNA página
      const px = this.W * this.s * (window.devicePixelRatio || 1);
      return Math.max(500, Math.min(2400, Math.round(px / 100) * 100));
    }

    #refresh() {
      const { f, S, leaves } = this;
      const order = [];
      const push = (leaf) => { if (leaf?.page && !order.includes(leaf.page)) order.push(leaf.page); };
      push(leaves[2 * f - 1]); push(leaves[2 * f]);                       // lo que se ve ahora
      for (const j of [f + 1, f - 2]) if (j >= 0 && j < S) { push(leaves[2 * j]); push(leaves[2 * j + 1]); }   // vecinos

      // liberar memoria de lo lejano
      const keep = new Set();
      for (let j = f - 3; j <= f + 3; j++) if (j >= 0 && j < S) { keep.add(leaves[2 * j]?.page); keep.add(leaves[2 * j + 1]?.page); }
      for (const [pn, ls] of this.byPage) {
        if (!keep.has(pn) && this.done.has(pn)) {
          ls.forEach((l) => { l.canvas.width = l.canvas.height = 0; });
          this.done.delete(pn);
        }
      }

      const token = this.token;
      this.wanted = new Set(order);          // los trabajos viejos que ya no interesan se saltan
      const jobs = order.map((pn) => (this.queue = this.queue
        .then(() => (token === this.token && this.wanted.has(pn)) ? this.#renderPage(pn, token) : null)
        .catch((err) => { if (err?.name !== 'RenderingCancelledException') console.warn(err); })));
      return Promise.all(jobs);
    }

    async #renderPage(pn, token) {
      const res = this.#targetRes;
      if ((this.done.get(pn) || 0) >= res * 0.8) return;
      const page = await this.doc.getPage(pn);
      const vp = page.getViewport({ scale: res / this.W });
      const off = document.createElement('canvas');
      off.width = Math.ceil(vp.width);
      off.height = Math.ceil(vp.height);
      const ctx = off.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, off.width, off.height);
      await page.render({ canvasContext: ctx, canvas: off, viewport: vp }).promise;
      if (token !== this.token) { off.width = off.height = 0; return; }

      for (const leaf of this.byPage.get(pn) || []) {
        const sw = leaf.part === 'full' ? off.width : Math.floor(off.width / 2);
        const sx = leaf.part === 'right' ? off.width - sw : 0;
        const c = leaf.canvas;
        c.width = sw;
        c.height = off.height;
        c.getContext('2d').drawImage(off, sx, 0, sw, off.height, 0, 0, sw, off.height);
      }
      off.width = off.height = 0;
      this.done.set(pn, res);
    }

    /* ---- Teclado + swipe ---- */
    #bindInput() {
      let x0 = 0, y0 = 0, active = false;
      this.stage.addEventListener('pointerdown', (e) => { active = true; x0 = e.clientX; y0 = e.clientY; });
      this.stage.addEventListener('pointerup', (e) => {
        if (!active) return;
        active = false;
        const dx = e.clientX - x0, dy = e.clientY - y0;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? this.next() : this.prev());
      });
      this.stage.addEventListener('pointercancel', () => { active = false; });

      window.addEventListener('keydown', (e) => {
        if (!this.isOpen || !$('#screen-viewer').classList.contains('is-active')) return;
        if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); this.next(); }
        else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); this.prev(); }
      });
    }
  }

  /* ----------------------------------------------------------
     5 · APP: pantallas y flujo
     ---------------------------------------------------------- */
  const screens = {
    home:   $('#screen-home'),
    viewer: $('#screen-viewer'),
  };
  function show(name) {
    for (const [k, el] of Object.entries(screens)) el.classList.toggle('is-active', k === name);
  }

  const book = new Flipbook({
    stage: $('#stage'),
    slider: $('#slider'),
    book: $('#book'),
    status: $('#status'),
  });

  /* ---- Barra superior ---- */
  const bar = { svg: null, back: null, next: null, home: null };

  /* En pantallas angostas, acerca los botones al centro y recorta el viewBox
     para que no queden diminutos. */
  function layoutBar() {
    if (!bar.svg) return;
    const narrow = $('#bar-host').clientWidth < 900;
    bar.svg.setAttribute('viewBox', narrow ? '660 51 600 100' : '0 51 1920 100');
    bar.back.slot.setAttribute('transform', narrow ? 'translate(580 0)' : '');
    bar.next.slot.setAttribute('transform', narrow ? 'translate(-581 0)' : '');
  }

  function setupBar() {
    const svg = mountSvg($('#bar-host'), 'bar', 'bar');
    const paths = getPaths(svg);
    // Se localizan los tres botones ANTES de agruparlos (al agrupar cambian los índices).
    const locate = ({ ids, index }) => { const el = findById(svg, 'bar', ids); return [el || paths[index]]; };
    const cfg = CONFIG.barButtons;
    const found = { back: locate(cfg.back), next: locate(cfg.next), home: locate(cfg.home) };
    bar.svg  = svg;
    bar.back = makeHotspot(found.back, { label: 'Publicación anterior', pad: 34, onActivate: () => stepPublication(-1) });
    bar.next = makeHotspot(found.next, { label: 'Publicación siguiente', pad: 34, onActivate: () => stepPublication(+1) });
    bar.home = makeHotspot(found.home, { label: 'Casa',                 pad: 34, onActivate: goHome });
    layoutBar();
    new ResizeObserver(layoutBar).observe($('#bar-host'));
  }

  /* ---- Home ---- */
  function setupHome() {
    const svg = mountSvg($('#home-host'), 'home', 'home');
    const paths = getPaths(svg);
    // Primero se recogen todos los grupos de <path>, luego se crean los botones
    const groups = CONFIG.homeButtons.map((b) => ({ b, els: paths.slice(b.paths[0], b.paths[1] + 1) }));
    for (const { b, els } of groups) {
      makeHotspot(els, { label: b.label, pad: 28, onActivate: () => openPublication(b) });
    }
  }

  /* ---- Navegación entre pantallas ---- */
  const publications = Object.fromEntries(CONFIG.homeButtons.map((b) => [b.id, b]));
  let currentId = null;                       // publicación abierta en el visor

  async function openPublication(b) {
    currentId = b.id;
    show('viewer');
    await book.open(b.pdf, b.coverMode);
  }

  /* Cambia de publicación en ciclo continuo según CONFIG.order:
       +1 (Siguiente): Gaceta → Catálogo → Memoria → Gaceta …
       -1 (Volver):    Gaceta → Memoria → Catálogo → Gaceta …                     */
  function stepPublication(dir) {
    if (!currentId) return;
    const order = CONFIG.order;
    const i = order.indexOf(currentId);
    openPublication(publications[order[(i + dir + order.length) % order.length]]);
  }

  function goHome() {
    show('home');
    setTimeout(() => {
      if (!screens.viewer.classList.contains('is-active')) { book.close(); currentId = null; }
    }, 500);
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && screens.viewer.classList.contains('is-active')) goHome();
  });

  /* ---- Intro: 2,5 s y fade out ---- */
  const intro = $('#screen-intro');
  mountSvg(intro, 'intro', 'intro');
  setTimeout(() => {
    intro.classList.remove('is-active');           // CSS hace el fade (opacity 1.2 s)
    setTimeout(() => intro.remove(), 1400);
  }, CONFIG.introMs);

  /* ---- Arranque ---- */
  setupHome();
  setupBar();
})();

  </script>
</body>
</html>
